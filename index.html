<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c12" media="(prefers-color-scheme: dark)">
<title>Scroll Report</title>
<style>
  :root {
    --bg: #f4f5f9;
    --panel: #ffffff;
    --fg: #14161f;
    --muted: #5d6479;
    --line: #d9dce6;
    --grid: #c9cddb;
    --floor: #e6e8f0;
    --accent: #4f46e5;
    --ok: #15803d;
    --warn: #b45309;
    --err: #b91c1c;
    --hot: #e0334a;
    --cold: #3b6fd8;
    --shadow: #8a90a6;
    --ax-x: #d9364c;
    --ax-y: #1f9d55;
    --ax-z: #2f6fe0;
  }
  :root[data-theme="dark"] {
    --bg: #0b0c12;
    --panel: #12141d;
    --fg: #eef0f8;
    --muted: #9aa2bf;
    --line: #242838;
    --grid: #2c3145;
    --floor: #161926;
    --accent: #7c74ff;
    --ok: #5ef08f;
    --warn: #fbbf24;
    --err: #ff7b7b;
    --hot: #ff5a6e;
    --cold: #4f8dff;
    --shadow: #50577a;
    --ax-x: #ff7a8a;
    --ax-y: #5fe39a;
    --ax-z: #7aa8ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0c12;
      --panel: #12141d;
      --fg: #eef0f8;
      --muted: #9aa2bf;
      --line: #242838;
      --grid: #2c3145;
      --floor: #161926;
      --accent: #7c74ff;
      --ok: #5ef08f;
      --warn: #fbbf24;
      --err: #ff7b7b;
      --hot: #ff5a6e;
      --cold: #4f8dff;
      --shadow: #50577a;
      --ax-x: #ff7a8a;
      --ax-y: #5fe39a;
      --ax-z: #7aa8ff;
    }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-text-size-adjust: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; font-weight: 650; letter-spacing: 0.3px; }
  #version {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #status {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
  }
  #status.ok { color: var(--ok); }
  #status.warn { color: var(--warn); }
  #status.err { color: var(--err); }
  main {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #start {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 14px;
    padding: 16px 32px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 24px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  #start[hidden] { display: none; }
  nav {
    display: flex;
    gap: 6px;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  nav button {
    flex: 1 1 0;
    min-width: 0;
    padding: 9px 4px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  nav button[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    border-color: var(--accent);
  }
  nav button:disabled { opacity: 0.4; }
</style>
<script>
  try {
    const t = localStorage.getItem('scroll-report-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<header>
  <h1>Scroll Report</h1>
  <span id="version">v1.0.0 · 2026-09-25</span>
  <span id="status">Waiting</span>
</header>

<main>
  <canvas id="canvas"></canvas>
  <button id="start">Enable Motion</button>
</main>

<nav>
  <button id="btn-wake" aria-pressed="false">Keep Awake</button>
  <button id="btn-smooth" aria-pressed="true">Smoothing</button>
  <button id="btn-theme">Theme: Auto</button>
</nav>

<script>
(() => {
  'use strict';

  const G = 9.80665;
  const WINDOW_MS = 20000;
  const FULL_G = 0.5;
  const CLAMP_G = 0.6;
  const FLOOR_G = 0.01;
  const SMOOTH_TAU = 0.15;
  const GRAVITY_TAU = 1.0;
  const CAP = 8192;
  const BIN_PX = 2;
  const GRID_MS = 2000;
  const NO_DATA_MS = 2500;
  const STALL_MS = 3000;

  // Oblique projection: Y recedes up-and-right, Z lifts straight up.
  const OBL = 0.55;
  const OBL_COS = Math.cos(Math.PI / 6) * OBL;
  const OBL_SIN = Math.sin(Math.PI / 6) * OBL;
  const Z_GAIN = 0.7;
  // Older history shrinks toward the bottom to read as receding.
  const RECEDE = 0.45;

  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = $('status');
  const startBtn = $('start');
  const btnWake = $('btn-wake');
  const btnSmooth = $('btn-smooth');
  const btnTheme = $('btn-theme');

  const bufX = new Float32Array(CAP);
  const bufY = new Float32Array(CAP);
  const bufZ = new Float32Array(CAP);
  const bufT = new Float64Array(CAP);
  let head = 0, count = 0;

  let binX, binY, binZ, binN;

  let W = 0, H = 0, dpr = 1;
  let cx = 0, headY = 0, span = 0, scale = 1;
  let colors = {};

  let started = false, hidden = false;
  let optSmooth = true, optWake = false;
  let theme = document.documentElement.dataset.theme || 'auto';
  let wakeLock = null;

  let smX = 0, smY = 0, smZ = 0;
  let gX = 0, gY = 0, gZ = 0, gInit = false;
  let sign = 1;
  let lastSample = 0, startedAt = 0;
  let fallback = false, stalled = false, noData = false;
  let flashUntil = 0;
  let rafId = 0;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  function refreshStatus() {
    if (performance.now() < flashUntil) return;
    if (!started) setStatus('Waiting');
    else if (noData) setStatus('No sensor data', 'err');
    else if (stalled) setStatus('Sensor stalled', 'warn');
    else if (fallback) setStatus('Live · est. gravity', 'warn');
    else setStatus('Live', 'ok');
  }

  function flash(text, cls) {
    flashUntil = performance.now() + 2500;
    setStatus(text, cls);
    setTimeout(refreshStatus, 2600);
  }

  // Theme

  function hexToRgb(hex) {
    const n = parseInt(hex.trim().slice(1), 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }

  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    const get = name => cs.getPropertyValue(name).trim();
    colors = {
      bg: get('--bg'), fg: get('--fg'), muted: get('--muted'),
      grid: get('--grid'), floor: get('--floor'), shadow: get('--shadow'),
      x: get('--ax-x'), y: get('--ax-y'), z: get('--ax-z'),
      hot: hexToRgb(get('--hot')), cold: hexToRgb(get('--cold')),
    };
  }

  function applyTheme() {
    if (theme === 'auto') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = theme;
    btnTheme.textContent = 'Theme: ' + theme[0].toUpperCase() + theme.slice(1);
    try { localStorage.setItem('scroll-report-theme', theme); } catch (e) {}
    readColors();
    draw();
  }

  btnTheme.addEventListener('click', () => {
    theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto';
    applyTheme();
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    readColors();
    draw();
  });

  // Geometry

  function resize() {
    const r = canvas.getBoundingClientRect();
    W = r.width;
    H = r.height;
    if (!W || !H) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    scale = Math.min(W * 0.3, H * 0.16, 240) / FULL_G;
    cx = W / 2;
    headY = Math.max(FULL_G * scale * Z_GAIN + 24, H * 0.2);
    span = H - headY - 12;

    const bins = Math.max(8, Math.ceil(span / BIN_PX));
    binX = new Float32Array(bins);
    binY = new Float32Array(bins);
    binZ = new Float32Array(bins);
    binN = new Uint16Array(bins);
    draw();
  }

  function sx(x, y, f) {
    return cx + (1 - RECEDE * f) * scale * (x + y * OBL_COS);
  }

  function sy(y, z, f) {
    return headY + span * f - (1 - RECEDE * f) * scale * (y * OBL_SIN + z * Z_GAIN);
  }

  function clampG(v) {
    return v > CLAMP_G ? CLAMP_G : v < -CLAMP_G ? -CLAMP_G : v;
  }

  // Motion

  function screenAngle() {
    // window.orientation first: iPadOS leaves screen.orientation.angle at 0.
    if (typeof window.orientation === 'number') return window.orientation;
    const so = screen.orientation;
    return so && typeof so.angle === 'number' ? so.angle : 0;
  }

  function onMotion(e) {
    const now = performance.now();
    const dt = lastSample ? Math.min((now - lastSample) / 1000, 0.25) : 1 / 60;
    lastSample = now;

    const ig = e.accelerationIncludingGravity;
    const hasIg = ig && ig.x !== null;
    if (hasIg) {
      const k = gInit ? 1 - Math.exp(-dt / GRAVITY_TAU) : 1;
      gX += (ig.x / G - gX) * k;
      gY += (ig.y / G - gY) * k;
      gZ += (ig.z / G - gZ) * k;
      gInit = true;
    }

    let ax, ay, az;
    const a = e.acceleration;
    if (a && a.x !== null) {
      ax = a.x / G; ay = a.y / G; az = a.z / G;
      fallback = false;
    } else if (hasIg) {
      ax = ig.x / G - gX; ay = ig.y / G - gY; az = ig.z / G - gZ;
      fallback = true;
    } else {
      return;
    }

    const rad = screenAngle() * Math.PI / 180;
    const c = Math.cos(rad), s = Math.sin(rad);

    // The spec's gravity reaction points up out of a screen that's being
    // looked at. iOS reports the whole event negated, so the sign of that
    // reaction tells us which convention this device speaks.
    if (gInit) {
      const up = gX * s + gY * c + gZ;
      if (up > 0.3) sign = 1;
      else if (up < -0.3) sign = -1;
    }

    const rx = sign * (ax * c - ay * s);
    const ry = sign * (ax * s + ay * c);
    const rz = sign * az;

    const k = 1 - Math.exp(-dt / SMOOTH_TAU);
    smX += (rx - smX) * k;
    smY += (ry - smY) * k;
    smZ += (rz - smZ) * k;

    let x = optSmooth ? smX : rx;
    let y = optSmooth ? smY : ry;
    let z = optSmooth ? smZ : rz;

    // Soft floor: shrink the vector by FLOOR_G instead of snapping to zero.
    const m = Math.hypot(x, y, z);
    const f = m > FLOOR_G ? (m - FLOOR_G) / m : 0;
    x *= f; y *= f; z *= f;

    bufX[head] = x;
    bufY[head] = y;
    bufZ[head] = z;
    bufT[head] = now;
    head = (head + 1) % CAP;
    if (count < CAP) count++;

    if (noData || stalled) { noData = stalled = false; refreshStatus(); }
    else if (statusEl.className !== (fallback ? 'warn' : 'ok')) refreshStatus();
  }

  // Drawing

  function lerpColor(t, alpha) {
    const h = colors.hot, c = colors.cold;
    return 'rgba(' + Math.round(c[0] + (h[0] - c[0]) * t) + ',' +
      Math.round(c[1] + (h[1] - c[1]) * t) + ',' +
      Math.round(c[2] + (h[2] - c[2]) * t) + ',' + alpha.toFixed(3) + ')';
  }

  function line(x0, y0, x1, y1) {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  function drawFloor(now) {
    const F = FULL_G;

    ctx.fillStyle = colors.floor;
    ctx.beginPath();
    ctx.moveTo(sx(-F, -F, 0), sy(-F, 0, 0));
    ctx.lineTo(sx(F, -F, 0), sy(-F, 0, 0));
    ctx.lineTo(sx(F, F, 0), sy(F, 0, 0));
    ctx.lineTo(sx(-F, F, 0), sy(F, 0, 0));
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(sx(-F, 0, 0), sy(0, 0, 0));
    ctx.lineTo(sx(F, 0, 0), sy(0, 0, 0));
    ctx.lineTo(sx(F, 0, 1), sy(0, 0, 1));
    ctx.lineTo(sx(-F, 0, 1), sy(0, 0, 1));
    ctx.closePath();
    ctx.globalAlpha = 0.55;
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 1;
    line(sx(0, 0, 0), sy(0, 0, 0), sx(0, 0, 1), sy(0, 0, 1));
    ctx.setLineDash([3, 4]);
    line(sx(-F, 0, 0), sy(0, 0, 0), sx(-F, 0, 1), sy(0, 0, 1));
    line(sx(F, 0, 0), sy(0, 0, 0), sx(F, 0, 1), sy(0, 0, 1));
    ctx.setLineDash([]);

    // Chart-paper rules pinned to absolute time, so they scroll with the data.
    if (started) {
      const first = Math.ceil((now - WINDOW_MS) / GRID_MS) * GRID_MS;
      for (let t = first; t <= now; t += GRID_MS) {
        const f = (now - t) / WINDOW_MS;
        ctx.globalAlpha = 0.9 - f * 0.6;
        line(sx(-F, 0, f), sy(0, 0, f), sx(F, 0, f), sy(0, 0, f));
      }
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = colors.muted;
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let s = 5; s * 1000 <= WINDOW_MS; s += 5) {
      const f = s * 1000 / WINDOW_MS;
      ctx.fillText('−' + s + 's', sx(-F, 0, f) - 6, sy(0, 0, f));
    }
    ctx.textAlign = 'left';
    ctx.fillText(F + 'G', sx(F, 0, 0) + 4, sy(0, 0, 0) + 8);
  }

  function drawAxes() {
    const L = FULL_G * 0.9;
    const ox = sx(0, 0, 0), oy = sy(0, 0, 0);
    const axes = [
      ['X', colors.x, sx(L, 0, 0), sy(0, 0, 0)],
      ['Y', colors.y, sx(0, L, 0), sy(L, 0, 0)],
      ['Z', colors.z, sx(0, 0, 0), sy(0, L, 0)],
    ];
    ctx.lineWidth = 1.5;
    ctx.font = '600 11px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const [label, color, x, y] of axes) {
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.6;
      line(ox, oy, x, y);
      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      const d = Math.hypot(x - ox, y - oy) || 1;
      ctx.fillText(label, x + (x - ox) / d * 9, y + (y - oy) / d * 9);
    }
  }

  function binHistory(now) {
    const bins = binN.length;
    const binMs = WINDOW_MS / bins;
    binX.fill(0); binY.fill(0); binZ.fill(0); binN.fill(0);
    // Bins are anchored to absolute time so the ribbon scrolls smoothly
    // instead of reshuffling samples between bins every frame.
    const newest = Math.floor(now / binMs);
    for (let i = 1; i <= count; i++) {
      const k = (head - i + CAP) % CAP;
      const b = newest - Math.floor(bufT[k] / binMs);
      if (b >= bins) break;
      if (b < 0) continue;
      binX[b] += bufX[k];
      binY[b] += bufY[k];
      binZ[b] += bufZ[k];
      binN[b]++;
    }
    for (let b = 0; b < bins; b++) {
      const n = binN[b];
      if (!n) continue;
      binX[b] = clampG(binX[b] / n);
      binY[b] = clampG(binY[b] / n);
      binZ[b] = clampG(binZ[b] / n);
    }
    return { bins, binMs, offset: now / binMs - newest };
  }

  function drawRibbon(now) {
    const { bins, offset } = binHistory(now);
    const fAt = b => (b + offset) / bins;

    const shadowPath = new Path2D();
    const stalkPath = new Path2D();
    let pen = false;
    for (let b = bins - 1; b >= 0; b--) {
      if (!binN[b]) { pen = false; continue; }
      const f = fAt(b);
      if (f > 1) continue;
      const px = sx(binX[b], binY[b], f), py = sy(binY[b], 0, f);
      if (pen) shadowPath.lineTo(px, py); else shadowPath.moveTo(px, py);
      pen = true;
      if (b % 6 === 0) {
        stalkPath.moveTo(px, py);
        stalkPath.lineTo(px, sy(binY[b], binZ[b], f));
      }
    }
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = colors.shadow;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = 1;
    ctx.stroke(stalkPath);
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 1.5;
    ctx.stroke(shadowPath);
    ctx.globalAlpha = 1;

    // Oldest first so fresh history paints over the faded tail.
    const BATCH = 8;
    for (let hi = bins - 1; hi > 0; hi -= BATCH) {
      const lo = Math.max(0, hi - BATCH);
      const t = 1 - fAt((hi + lo) / 2);
      if (t < 0) continue;
      ctx.beginPath();
      let drawing = false;
      for (let b = hi; b >= lo; b--) {
        if (!binN[b] || fAt(b) > 1) { drawing = false; continue; }
        const f = fAt(b);
        const px = sx(binX[b], binY[b], f), py = sy(binY[b], binZ[b], f);
        if (drawing) ctx.lineTo(px, py); else ctx.moveTo(px, py);
        drawing = true;
      }
      ctx.strokeStyle = lerpColor(t, 0.2 + 0.8 * t * t);
      ctx.lineWidth = 1 + 2.2 * t;
      ctx.stroke();
    }

    if (!count) return;
    const k = (head - 1 + CAP) % CAP;
    if (now - bufT[k] > STALL_MS) return;
    const hx = sx(clampG(bufX[k]), clampG(bufY[k]), 0);
    const hy = sy(clampG(bufY[k]), clampG(bufZ[k]), 0);
    const gy = sy(clampG(bufY[k]), 0, 0);

    ctx.strokeStyle = colors.shadow;
    ctx.lineWidth = 1;
    line(hx, gy, hx, hy);
    ctx.fillStyle = colors.shadow;
    ctx.beginPath();
    ctx.ellipse(hx, gy, 4, 2, 0, 0, Math.PI * 2);
    ctx.fill();

    const pulse = (now % 1000) / 1000;
    ctx.strokeStyle = lerpColor(1, 0.5 * (1 - pulse));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(hx, hy, 5 + pulse * 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = lerpColor(1, 1);
    ctx.beginPath();
    ctx.arc(hx, hy, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw() {
    if (!W || !binN) return;
    const now = performance.now();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, W, H);
    drawFloor(now);
    drawAxes();
    if (started) drawRibbon(now);
  }

  function frame() {
    rafId = requestAnimationFrame(frame);
    const now = performance.now();
    const quiet = now - (lastSample || startedAt);
    if (!count && quiet > NO_DATA_MS && !noData) { noData = true; refreshStatus(); }
    if (count && quiet > STALL_MS && !stalled) { stalled = true; refreshStatus(); }
    draw();
  }

  function startLoop() {
    if (!rafId && started && !hidden) rafId = requestAnimationFrame(frame);
  }

  function stopLoop() {
    cancelAnimationFrame(rafId);
    rafId = 0;
  }

  // Lifecycle

  function begin() {
    started = true;
    startedAt = performance.now();
    startBtn.hidden = true;
    window.addEventListener('devicemotion', onMotion);
    refreshStatus();
    startLoop();
  }

  startBtn.addEventListener('click', () => {
    if (typeof DeviceMotionEvent === 'undefined') {
      setStatus('No motion sensor', 'err');
      return;
    }
    if (typeof DeviceMotionEvent.requestPermission !== 'function') {
      begin();
      return;
    }
    DeviceMotionEvent.requestPermission()
      .then(state => state === 'granted' ? begin() : setStatus('Permission denied', 'err'))
      .catch(err => setStatus('Error: ' + err.message, 'err'));
  });

  function acquireWake() {
    if (wakeLock || hidden || !optWake) return;
    navigator.wakeLock.request('screen').then(lock => {
      if (!optWake || hidden) { lock.release(); return; }
      wakeLock = lock;
      lock.addEventListener('release', () => { wakeLock = null; });
    }).catch(() => {
      optWake = false;
      btnWake.setAttribute('aria-pressed', 'false');
      flash('Wake lock refused', 'warn');
    });
  }

  function releaseWake() {
    if (wakeLock) wakeLock.release().catch(() => {});
    wakeLock = null;
  }

  if (!('wakeLock' in navigator)) btnWake.disabled = true;
  btnWake.addEventListener('click', () => {
    optWake = !optWake;
    btnWake.setAttribute('aria-pressed', String(optWake));
    if (optWake) acquireWake(); else releaseWake();
  });

  btnSmooth.addEventListener('click', () => {
    optSmooth = !optSmooth;
    btnSmooth.setAttribute('aria-pressed', String(optSmooth));
  });

  document.addEventListener('visibilitychange', () => {
    hidden = document.hidden;
    if (hidden) {
      stopLoop();
      releaseWake();
    } else {
      lastSample = 0;
      startedAt = performance.now();
      startLoop();
      acquireWake();
    }
  });

  new ResizeObserver(resize).observe(canvas);

  readColors();
  btnTheme.textContent = 'Theme: ' + theme[0].toUpperCase() + theme.slice(1);
  resize();
})();
</script>
</body>
</html>
