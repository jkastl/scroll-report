<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c12" media="(prefers-color-scheme: dark)">
<title>Scroll Report</title>
<style>
  :root {
    --bg: #f4f5f9;
    --panel: #ffffff;
    --fg: #14161f;
    --muted: #5d6479;
    --line: #d9dce6;
    --grid: #c9cddb;
    --floor: #e6e8f0;
    --accent: #4f46e5;
    --ok: #15803d;
    --warn: #b45309;
    --err: #b91c1c;
    --hot: #e0334a;
    --cold: #3b6fd8;
    --shadow: #8a90a6;
    --ax-x: #d9364c;
    --ax-y: #1f9d55;
    --ax-z: #2f6fe0;
  }
  :root[data-theme="dark"] {
    --bg: #0b0c12;
    --panel: #12141d;
    --fg: #eef0f8;
    --muted: #9aa2bf;
    --line: #242838;
    --grid: #2c3145;
    --floor: #161926;
    --accent: #7c74ff;
    --ok: #5ef08f;
    --warn: #fbbf24;
    --err: #ff7b7b;
    --hot: #ff5a6e;
    --cold: #4f8dff;
    --shadow: #50577a;
    --ax-x: #ff7a8a;
    --ax-y: #5fe39a;
    --ax-z: #7aa8ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0c12;
      --panel: #12141d;
      --fg: #eef0f8;
      --muted: #9aa2bf;
      --line: #242838;
      --grid: #2c3145;
      --floor: #161926;
      --accent: #7c74ff;
      --ok: #5ef08f;
      --warn: #fbbf24;
      --err: #ff7b7b;
      --hot: #ff5a6e;
      --cold: #4f8dff;
      --shadow: #50577a;
      --ax-x: #ff7a8a;
      --ax-y: #5fe39a;
      --ax-z: #7aa8ff;
    }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-text-size-adjust: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; font-weight: 650; letter-spacing: 0.3px; }
  #version {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #status {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
  }
  #status.ok { color: var(--ok); }
  #status.warn { color: var(--warn); }
  #status.err { color: var(--err); }
  main {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  canvas {
    touch-action: none;
    cursor: grab;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #start {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 14px;
    padding: 16px 32px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 24px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  #start[hidden] { display: none; }
  nav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  nav button {
    min-width: 0;
    padding: 9px 5px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: clamp(10px, 3.1vw, 13px);
    white-space: nowrap;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  nav button[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    border-color: var(--accent);
  }
  nav button:disabled { opacity: 0.4; }
</style>
<script>
  try {
    const t = localStorage.getItem('scroll-report-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<header>
  <h1>Scroll Report</h1>
  <span id="version">v1.5.1 · 2026-09-25</span>
  <span id="status">Waiting</span>
</header>

<main>
  <canvas id="canvas"></canvas>
  <button id="start">Enable Motion</button>
</main>

<nav>
  <button id="btn-pause" aria-pressed="false" disabled>Pause</button>
  <button id="btn-invert" aria-pressed="false">Invert</button>
  <button id="btn-smooth" aria-pressed="true">Smoothing</button>
  <button id="btn-wake" aria-pressed="false">Keep Awake</button>
  <button id="btn-view">View: Road</button>
  <button id="btn-theme">Theme: Auto</button>
</nav>

<script>
(() => {
  'use strict';

  const G = 9.80665;
  const WINDOW_MS = 20000;
  const FULL_G = 0.5;
  const CLAMP_G = 0.6;
  const FLOOR_G = 0.01;
  const SMOOTH_TAU = 0.15;
  const GRAVITY_TAU = 1.0;
  const CAP = 8192;
  const BIN_PX = 2;
  const GRID_MS = 2000;
  const NO_DATA_MS = 2500;
  const STALL_MS = 3000;

  // One 3D scene seen through an orbiting camera. X runs across the road,
  // history runs back along it (ROAD_LEN at the window's end), Z lifts off
  // it, and Y nudges a sample along the road.
  const Z_GAIN = 0.7;
  const ROAD_LEN = 1.2;
  const Y_DEPTH = 0.16;
  // Forward acceleration speeds up the paper feed and braking slows it, so
  // Y shows as history stretched or squeezed along the road.
  const FEED_GAIN = 2.5;
  const FEED_MIN = 0.25;
  const FEED_MAX = 3;
  const HISTORY_MS = WINDOW_MS / FEED_MIN;
  const AHEAD = 0.3;
  const NEAR = 0.05;
  const PITCH_MIN = 0.03;
  const PITCH_MAX = 1.54;
  const DRAG_RAD_PER_PX = 0.008;
  const TWEEN_MS = 450;

  // tf: where along the road the camera aims (fraction of the window).
  // oy: where that aim point lands on screen (fraction of the height).
  // aspect: how wide the scene is, so the zoom can use landscape width.
  const PRESETS = [
    { id: 'road', label: 'Road', yaw: 0.12, pitch: 0.62, dist: 1.7, tf: 0.02, zoom: 1.55, oy: 0.24, aspect: 0.75 },
    { id: 'chase', label: 'Chase', yaw: 0.75, pitch: 0.55, dist: 2.2, tf: 0.4, zoom: 1.25, oy: 0.5, aspect: 1.3 },
    { id: 'side', label: 'Side', yaw: -Math.PI / 2, pitch: 0.18, dist: 2.2, tf: 0.45, zoom: 1.3, oy: 0.64, aspect: 2.6 },
    { id: 'top', label: 'Top', yaw: 0, pitch: PITCH_MAX, dist: 2.4, tf: 0.42, zoom: 1.35, oy: 0.5, aspect: 0.75 },
    { id: 'head', label: 'Head-on', yaw: Math.PI, pitch: 0.32, dist: 1.1, tf: 0.1, zoom: 0.9, oy: 0.42, aspect: 1.6 },
  ];

  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = $('status');
  const startBtn = $('start');
  const btnWake = $('btn-wake');
  const btnSmooth = $('btn-smooth');
  const btnPause = $('btn-pause');
  const btnTheme = $('btn-theme');
  const btnView = $('btn-view');
  const btnInvert = $('btn-invert');

  const bufX = new Float32Array(CAP);
  const bufY = new Float32Array(CAP);
  const bufZ = new Float32Array(CAP);
  const bufT = new Float64Array(CAP);
  let head = 0, count = 0;

  let binX, binY, binZ, binN, binF;
  let binMs = 1, binOffset = 0, fed = false;

  let W = 0, H = 0, dpr = 1;
  let PX = 0, PY = 0, PZ = 0, PV = true;
  let cam = { ...PRESETS[0] };
  let presetIdx = 0, customCam = false, tween = null, drag = null;
  const C = {};
  let colors = {};

  let started = false, hidden = false;
  let optSmooth = true, optWake = false, optInvert = false;
  let theme = document.documentElement.dataset.theme || 'auto';
  try {
    const saved = JSON.parse(localStorage.getItem('scroll-report-cam') || 'null');
    const i = saved ? PRESETS.findIndex(p => p.id === saved.preset) : -1;
    if (i >= 0) { presetIdx = i; cam = { ...PRESETS[i] }; }
    if (saved && saved.custom) {
      for (const k of ['yaw', 'pitch']) if (typeof saved[k] === 'number') cam[k] = saved[k];
      customCam = true;
    }
    optInvert = localStorage.getItem('scroll-report-invert') === '1';
  } catch (e) {}
  let wakeLock = null;

  let smX = 0, smY = 0, smZ = 0;
  let gX = 0, gY = 0, gZ = 0, gInit = false;
  let sign = 1;
  let lastSample = 0, startedAt = 0;
  let fallback = false, stalled = false, noData = false;
  let flashUntil = 0;
  let rafId = 0;
  let paused = false, pausedAt = 0, pausedTotal = 0;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  function refreshStatus() {
    if (performance.now() < flashUntil) return;
    if (!started) setStatus('Waiting');
    else if (paused) setStatus('Paused');
    else if (noData) setStatus('No sensor data', 'err');
    else if (stalled) setStatus('Sensor stalled', 'warn');
    else if (fallback) setStatus('Live · est. gravity', 'warn');
    else setStatus('Live', 'ok');
  }

  function flash(text, cls) {
    flashUntil = performance.now() + 2500;
    setStatus(text, cls);
    setTimeout(refreshStatus, 2600);
  }

  // Theme

  function hexToRgb(hex) {
    const n = parseInt(hex.trim().slice(1), 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }

  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    const get = name => cs.getPropertyValue(name).trim();
    colors = {
      bg: get('--bg'), fg: get('--fg'), muted: get('--muted'),
      grid: get('--grid'), floor: get('--floor'), shadow: get('--shadow'),
      x: get('--ax-x'), y: get('--ax-y'), z: get('--ax-z'),
      hot: hexToRgb(get('--hot')), cold: hexToRgb(get('--cold')),
    };
  }

  function applyTheme() {
    if (theme === 'auto') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = theme;
    btnTheme.textContent = 'Theme: ' + theme[0].toUpperCase() + theme.slice(1);
    try { localStorage.setItem('scroll-report-theme', theme); } catch (e) {}
    readColors();
    draw();
  }

  btnTheme.addEventListener('click', () => {
    theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto';
    applyTheme();
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    readColors();
    draw();
  });

  // Geometry

  // Camera

  function updateCamera() {
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const cyw = Math.cos(cam.yaw), syw = Math.sin(cam.yaw);
    C.fx = syw * cp; C.fy = cyw * cp; C.fz = -sp;
    C.rx = cyw; C.ry = -syw;
    C.ux = C.ry * C.fz; C.uy = -C.rx * C.fz; C.uz = C.rx * C.fy - C.ry * C.fx;
    C.px = -cam.dist * C.fx;
    C.py = -cam.tf * ROAD_LEN - cam.dist * C.fy;
    C.pz = -cam.dist * C.fz;
    C.cx = W / 2;
    C.cy = H * cam.oy;
    C.focal = cam.zoom * Math.min(W, H * cam.aspect);
    project(0, 0, 0, 0);
    C.ref = PZ;
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    W = r.width;
    H = r.height;
    if (!W || !H) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    const bins = Math.max(8, Math.ceil(Math.max(W, H) / BIN_PX * HISTORY_MS / WINDOW_MS));
    binX = new Float32Array(bins);
    binY = new Float32Array(bins);
    binZ = new Float32Array(bins);
    binN = new Uint16Array(bins);
    binF = new Float32Array(bins);
    updateCamera();
    draw();
  }

  function redraw() {
    updateCamera();
    if (!rafId) draw();
  }

  function saveCam() {
    btnView.textContent = 'View: ' + (customCam ? 'Free' : PRESETS[presetIdx].label);
    try {
      localStorage.setItem('scroll-report-cam', JSON.stringify({
        preset: PRESETS[presetIdx].id, custom: customCam, yaw: cam.yaw, pitch: cam.pitch,
      }));
    } catch (e) {}
  }

  function tweenStep() {
    if (!tween) return;
    const t = Math.min((performance.now() - tween.t0) / TWEEN_MS, 1);
    const e = t * t * (3 - 2 * t);
    for (const k of ['pitch', 'dist', 'tf', 'zoom', 'oy', 'aspect']) {
      cam[k] = tween.from[k] + (tween.to[k] - tween.from[k]) * e;
    }
    cam.yaw = tween.from.yaw + tween.dYaw * e;
    redraw();
    if (t < 1) requestAnimationFrame(tweenStep); else tween = null;
  }

  // After a drag the button returns to the preset you left; otherwise it
  // moves on to the next one.
  btnView.addEventListener('click', () => {
    if (!customCam) presetIdx = (presetIdx + 1) % PRESETS.length;
    customCam = false;
    const to = PRESETS[presetIdx];
    const dYaw = ((to.yaw - cam.yaw) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
    tween = { from: { ...cam }, to, dYaw, t0: performance.now() };
    saveCam();
    requestAnimationFrame(tweenStep);
  });

  canvas.addEventListener('pointerdown', e => {
    if (drag) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
    tween = null;
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    cam.yaw += (e.clientX - drag.x) * DRAG_RAD_PER_PX;
    cam.pitch = Math.min(PITCH_MAX, Math.max(PITCH_MIN, cam.pitch + (e.clientY - drag.y) * DRAG_RAD_PER_PX));
    drag.x = e.clientX;
    drag.y = e.clientY;
    if (!customCam) { customCam = true; saveCam(); }
    redraw();
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null;
    saveCam();
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  function clampG(v) {
    return v > CLAMP_G ? CLAMP_G : v < -CLAMP_G ? -CLAMP_G : v;
  }

  // Motion

  function screenAngle() {
    // window.orientation first: iPadOS leaves screen.orientation.angle at 0.
    if (typeof window.orientation === 'number') return window.orientation;
    const so = screen.orientation;
    return so && typeof so.angle === 'number' ? so.angle : 0;
  }

  // The timeline clock stops while paused, so resuming picks up exactly where
  // the frozen history left off instead of leaving a gap.
  function clock() {
    return (paused ? pausedAt : performance.now()) - pausedTotal;
  }

  function onMotion(e) {
    if (paused) return;
    const now = performance.now();
    const dt = lastSample ? Math.min((now - lastSample) / 1000, 0.25) : 1 / 60;
    lastSample = now;

    const ig = e.accelerationIncludingGravity;
    const hasIg = ig && ig.x !== null;
    if (hasIg) {
      const k = gInit ? 1 - Math.exp(-dt / GRAVITY_TAU) : 1;
      gX += (ig.x / G - gX) * k;
      gY += (ig.y / G - gY) * k;
      gZ += (ig.z / G - gZ) * k;
      gInit = true;
    }

    let ax, ay, az;
    const a = e.acceleration;
    if (a && a.x !== null) {
      ax = a.x / G; ay = a.y / G; az = a.z / G;
      fallback = false;
    } else if (hasIg) {
      ax = ig.x / G - gX; ay = ig.y / G - gY; az = ig.z / G - gZ;
      fallback = true;
    } else {
      return;
    }

    const rad = screenAngle() * Math.PI / 180;
    const c = Math.cos(rad), s = Math.sin(rad);

    // The spec's gravity reaction points up out of a screen that's being
    // looked at. iOS reports the whole event negated, so the sign of that
    // reaction tells us which convention this device speaks.
    if (gInit) {
      const up = gX * s + gY * c + gZ;
      if (up > 0.3) sign = 1;
      else if (up < -0.3) sign = -1;
    }

    const rx = sign * (ax * c - ay * s);
    const ry = sign * (ax * s + ay * c);
    const rz = sign * az;

    const k = 1 - Math.exp(-dt / SMOOTH_TAU);
    smX += (rx - smX) * k;
    smY += (ry - smY) * k;
    smZ += (rz - smZ) * k;

    let x = optSmooth ? smX : rx;
    let y = optSmooth ? smY : ry;
    let z = optSmooth ? smZ : rz;

    // Soft floor: shrink the vector by FLOOR_G instead of snapping to zero.
    const m = Math.hypot(x, y, z);
    const f = m > FLOOR_G ? (m - FLOOR_G) / m : 0;
    x *= f; y *= f; z *= f;

    bufX[head] = x;
    bufY[head] = y;
    bufZ[head] = z;
    bufT[head] = now - pausedTotal;
    head = (head + 1) % CAP;
    if (count < CAP) count++;

    if (noData || stalled) { noData = stalled = false; refreshStatus(); }
    else if (statusEl.className !== (fallback ? 'warn' : 'ok')) refreshStatus();
  }

  // Drawing

  function lerpColor(t, alpha) {
    const h = colors.hot, c = colors.cold;
    return 'rgba(' + Math.round(c[0] + (h[0] - c[0]) * t) + ',' +
      Math.round(c[1] + (h[1] - c[1]) * t) + ',' +
      Math.round(c[2] + (h[2] - c[2]) * t) + ',' + alpha.toFixed(3) + ')';
  }

  function project(x, y, z, f) {
    const wx = x - C.px;
    const wy = y * Y_DEPTH - f * ROAD_LEN - C.py;
    const wz = z * Z_GAIN - C.pz;
    PZ = wx * C.fx + wy * C.fy + wz * C.fz;
    PV = PZ > NEAR;
    const k = C.focal / (PV ? PZ : NEAR);
    PX = C.cx + k * (wx * C.rx + wy * C.ry);
    PY = C.cy - k * (wx * C.ux + wy * C.uy + wz * C.uz);
  }

  function line(x0, y0, x1, y1) {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  // Shapes that reach behind the camera are skipped rather than clipped.
  function fillPoly(pts) {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      project(pts[i][0], pts[i][1], pts[i][2], pts[i][3]);
      if (!PV) return;
      if (i) ctx.lineTo(PX, PY); else ctx.moveTo(PX, PY);
    }
    ctx.fill();
  }

  function seg(x0, y0, z0, f0, x1, y1, z1, f1) {
    project(x0, y0, z0, f0);
    if (!PV) return;
    const ax = PX, ay = PY;
    project(x1, y1, z1, f1);
    if (PV) line(ax, ay, PX, PY);
  }

  function drawFloor(now) {
    const F = FULL_G;
    const ahead = -AHEAD;

    ctx.fillStyle = colors.floor;
    fillPoly([[-F, -F, 0, 0], [F, -F, 0, 0], [F, F, 0, 0], [-F, F, 0, 0]]);
    ctx.globalAlpha = 0.55;
    fillPoly([[-F, 0, 0, ahead], [F, 0, 0, ahead], [F, 0, 0, 1], [-F, 0, 0, 1]]);
    ctx.globalAlpha = 1;

    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 1;
    seg(0, 0, 0, ahead, 0, 0, 0, 1);
    ctx.setLineDash([3, 4]);
    seg(-F, 0, 0, ahead, -F, 0, 0, 1);
    seg(F, 0, 0, ahead, F, 0, 0, 1);
    ctx.setLineDash([]);

    // Chart-paper rules pinned to absolute time, so they scroll with the data.
    if (started) {
      const first = Math.ceil((now - WINDOW_MS) / GRID_MS) * GRID_MS;
      for (let t = first; t <= now; t += GRID_MS) {
        const f = feedAt(now - t);
        if (f > 1) continue;
        ctx.globalAlpha = 0.9 - f * 0.6;
        seg(-F, 0, 0, f, F, 0, 0, f);
      }
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = colors.muted;
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let s = 5; s * 1000 <= WINDOW_MS; s += 5) {
      const label = '−' + s + 's';
      const f = feedAt(s * 1000);
      if (f > 1) continue;
      project(-F, 0, 0, f);
      if (!PV) continue;
      const x = Math.max(PX - 6, ctx.measureText(label).width + 4);
      ctx.fillText(label, x, Math.min(PY - (x > PX - 6 ? 8 : 0), H - 8));
    }
    ctx.textAlign = 'left';
    project(F, 0, 0, 0);
    if (PV) ctx.fillText(F + 'G', Math.min(PX + 4, W - 30), PY + 8);
  }

  function drawAxes() {
    const L = FULL_G * 0.9;
    project(0, 0, 0, 0);
    const ox = PX, oy = PY;
    if (!PV) return;
    // Equal-length arrows. Y's true depth offset is tiny, so its arrow just
    // points up the road.
    const axes = [
      ['X', colors.x, L, 0, 0, 0],
      ['Y', colors.y, 0, 0, 0, -L / ROAD_LEN],
      ['Z', colors.z, 0, 0, L / Z_GAIN, 0],
    ];
    ctx.lineWidth = 1.5;
    ctx.font = '600 11px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const [label, color, x, y, z, f] of axes) {
      project(x, y, z, f);
      if (!PV) continue;
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.6;
      line(ox, oy, PX, PY);
      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      const d = Math.hypot(PX - ox, PY - oy) || 1;
      ctx.fillText(label, PX + (PX - ox) / d * 9, PY + (PY - oy) / d * 9);
    }
  }

  function binHistory(now) {
    const bins = binN.length;
    binMs = HISTORY_MS / bins;
    binX.fill(0); binY.fill(0); binZ.fill(0); binN.fill(0);
    // Bins are anchored to absolute time so the ribbon scrolls smoothly
    // instead of reshuffling samples between bins every frame.
    const newest = Math.floor(now / binMs);
    for (let i = 1; i <= count; i++) {
      const k = (head - i + CAP) % CAP;
      const b = newest - Math.floor(bufT[k] / binMs);
      if (b >= bins) break;
      if (b < 0) continue;
      binX[b] += bufX[k];
      binY[b] += bufY[k];
      binZ[b] += bufZ[k];
      binN[b]++;
    }
    const inv = optInvert ? -1 : 1;
    for (let b = 0; b < bins; b++) {
      const n = binN[b];
      if (!n) continue;
      binX[b] = clampG(inv * binX[b] / n);
      binY[b] = clampG(inv * binY[b] / n);
      binZ[b] = clampG(inv * binZ[b] / n);
    }

    // binF[b]: how far down the road bin b's older edge has been fed, as a
    // fraction of the window.
    binOffset = now / binMs - newest;
    let pos = 0, prevAge = 0;
    for (let b = 0; b < bins; b++) {
      const age = (b + binOffset) * binMs;
      const speed = binN[b] ? Math.min(FEED_MAX, Math.max(FEED_MIN, 1 + FEED_GAIN * binY[b])) : 1;
      pos += speed * (age - prevAge);
      prevAge = age;
      binF[b] = pos / WINDOW_MS;
    }
    fed = true;
  }

  // Where a moment of the given age sits on the road, after feed stretching.
  function feedAt(ageMs) {
    if (!fed) return ageMs / WINDOW_MS;
    const u = ageMs / binMs - binOffset;
    const b = Math.max(0, Math.ceil(u));
    if (b >= binF.length) return Infinity;
    const age1 = (b + binOffset) * binMs;
    const age0 = b ? age1 - binMs : 0;
    const f0 = b ? binF[b - 1] : 0;
    return f0 + (binF[b] - f0) * (ageMs - age0) / (age1 - age0 || 1);
  }

  function drawRibbon(now) {
    const bins = binN.length;

    const shadowPath = new Path2D();
    const stalkPath = new Path2D();
    let pen = false;
    for (let b = bins - 1; b >= 0; b--) {
      if (!binN[b]) { pen = false; continue; }
      const f = binF[b];
      if (f > 1) break;
      project(binX[b], 0, 0, f);
      if (!PV) { pen = false; continue; }
      if (pen) shadowPath.lineTo(PX, PY); else shadowPath.moveTo(PX, PY);
      pen = true;
      if (b % 6 === 0) {
        stalkPath.moveTo(PX, PY);
        project(binX[b], 0, binZ[b], f);
        if (PV) stalkPath.lineTo(PX, PY);
      }
    }
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = colors.shadow;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = 1;
    ctx.stroke(stalkPath);
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 1.5;
    ctx.stroke(shadowPath);
    ctx.globalAlpha = 1;

    // Oldest first so fresh history paints over the faded tail.
    const BATCH = 8;
    for (let hi = bins - 1; hi > 0; hi -= BATCH) {
      const lo = Math.max(0, hi - BATCH);
      const fm = Math.min(1, (binF[hi] + binF[lo]) / 2);
      if (binF[lo] > 1) continue;
      ctx.beginPath();
      let drawing = false;
      let depth = 0, n = 0;
      for (let b = hi; b >= lo; b--) {
        if (!binN[b] || binF[b] > 1) { drawing = false; continue; }
        project(binX[b], 0, binZ[b], binF[b]);
        if (!PV) { drawing = false; continue; }
        depth += PZ; n++;
        if (drawing) ctx.lineTo(PX, PY); else ctx.moveTo(PX, PY);
        drawing = true;
      }
      if (!n) continue;
      ctx.strokeStyle = lerpColor(1 - fm, 0.3 + 0.7 * (1 - fm));
      // Nearer history draws thicker, whichever way the camera faces.
      ctx.lineWidth = Math.min(4.5, Math.max(0.8, 1.8 * C.ref / (depth / n)));
      ctx.stroke();
    }

    if (!count) return;
    const k = (head - 1 + CAP) % CAP;
    if (now - bufT[k] > STALL_MS) return;
    const inv = optInvert ? -1 : 1;
    const x = clampG(inv * bufX[k]), z = clampG(inv * bufZ[k]);
    project(x, 0, 0, 0);
    if (!PV) return;
    const gx = PX, gy = PY;
    project(x, 0, z, 0);
    if (!PV) return;
    const hx = PX, hy = PY;

    ctx.strokeStyle = colors.shadow;
    ctx.lineWidth = 1;
    line(gx, gy, hx, hy);
    ctx.fillStyle = colors.shadow;
    ctx.beginPath();
    ctx.ellipse(gx, gy, 4, 2, 0, 0, Math.PI * 2);
    ctx.fill();

    const pulse = (now % 1000) / 1000;
    ctx.strokeStyle = lerpColor(1, 0.5 * (1 - pulse));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(hx, hy, 5 + pulse * 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = lerpColor(1, 1);
    ctx.beginPath();
    ctx.arc(hx, hy, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw() {
    if (!W || !binN) return;
    const now = clock();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, W, H);
    if (started) binHistory(now);
    drawFloor(now);
    drawAxes();
    if (started) drawRibbon(now);
  }

  function frame() {
    rafId = requestAnimationFrame(frame);
    const now = performance.now();
    const quiet = now - (lastSample || startedAt);
    if (!count && quiet > NO_DATA_MS && !noData) { noData = true; refreshStatus(); }
    if (count && quiet > STALL_MS && !stalled) { stalled = true; refreshStatus(); }
    draw();
  }

  function startLoop() {
    if (!rafId && started && !hidden && !paused) rafId = requestAnimationFrame(frame);
  }

  function stopLoop() {
    cancelAnimationFrame(rafId);
    rafId = 0;
  }

  // Lifecycle

  function begin() {
    started = true;
    startedAt = performance.now();
    startBtn.hidden = true;
    btnPause.disabled = false;
    window.addEventListener('devicemotion', onMotion);
    refreshStatus();
    startLoop();
  }

  startBtn.addEventListener('click', () => {
    if (typeof DeviceMotionEvent === 'undefined') {
      setStatus('No motion sensor', 'err');
      return;
    }
    if (typeof DeviceMotionEvent.requestPermission !== 'function') {
      begin();
      return;
    }
    DeviceMotionEvent.requestPermission()
      .then(state => state === 'granted' ? begin() : setStatus('Permission denied', 'err'))
      .catch(err => setStatus('Error: ' + err.message, 'err'));
  });

  function acquireWake() {
    if (wakeLock || hidden || !optWake) return;
    navigator.wakeLock.request('screen').then(lock => {
      if (!optWake || hidden) { lock.release(); return; }
      wakeLock = lock;
      lock.addEventListener('release', () => { wakeLock = null; });
    }).catch(() => {
      optWake = false;
      btnWake.setAttribute('aria-pressed', 'false');
      flash('Wake lock refused', 'warn');
    });
  }

  function releaseWake() {
    if (wakeLock) wakeLock.release().catch(() => {});
    wakeLock = null;
  }

  if (!('wakeLock' in navigator)) btnWake.disabled = true;
  btnWake.addEventListener('click', () => {
    optWake = !optWake;
    btnWake.setAttribute('aria-pressed', String(optWake));
    if (optWake) acquireWake(); else releaseWake();
  });

  btnPause.addEventListener('click', () => {
    paused = !paused;
    btnPause.textContent = paused ? 'Resume' : 'Pause';
    btnPause.setAttribute('aria-pressed', String(paused));
    if (paused) {
      pausedAt = performance.now();
      stopLoop();
      draw();
    } else {
      pausedTotal += performance.now() - pausedAt;
      lastSample = 0;
      startedAt = performance.now();
      stalled = false;
      startLoop();
    }
    refreshStatus();
  });

  // Invert draws the felt force (what pushes you) instead of the device's
  // own acceleration. It's applied at draw time so history flips with it.
  btnInvert.setAttribute('aria-pressed', String(optInvert));
  btnInvert.addEventListener('click', () => {
    optInvert = !optInvert;
    btnInvert.setAttribute('aria-pressed', String(optInvert));
    try { localStorage.setItem('scroll-report-invert', optInvert ? '1' : '0'); } catch (e) {}
    draw();
  });

  btnSmooth.addEventListener('click', () => {
    optSmooth = !optSmooth;
    btnSmooth.setAttribute('aria-pressed', String(optSmooth));
  });

  document.addEventListener('visibilitychange', () => {
    hidden = document.hidden;
    if (hidden) {
      stopLoop();
      releaseWake();
    } else {
      lastSample = 0;
      startedAt = performance.now();
      startLoop();
      acquireWake();
    }
  });

  new ResizeObserver(resize).observe(canvas);

  readColors();
  btnTheme.textContent = 'Theme: ' + theme[0].toUpperCase() + theme.slice(1);
  saveCam();
  resize();
})();
</script>
</body>
</html>
